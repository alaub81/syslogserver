version: 2
# Renovate owns version updates. Keep Dependabot available for security updates.
# Dependabot alerts and security updates must be enabled in repository settings.
updates:
  # 1) GitHub Actions (Workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 0
    rebase-strategy: "auto"
    labels: ["dependencies", "github-actions"]
  # 2) Dockerfiles (no regular version-update PRs)
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/resources/syslogng"
      - "/resources/loganalyzer"
      - "/resources/dbcleanup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 0
    rebase-strategy: "auto"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"
      include: "scope"

  # 3) Python lint dependencies (security updates only)
  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 0
    labels: ["dependencies", "python"]

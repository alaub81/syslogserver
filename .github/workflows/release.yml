name: Release (build & push)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      num_tags:
        description: 'Number of recent stable tags to rebuild (1-20)'
        required: false
        default: 1
        type: number
  schedule:
    - cron: '0 1 * * 2'  # Tuesday at 01:00 UTC; refresh the latest release's OS packages.

permissions:
  contents: read

# Serialize publishing so scheduled rebuilds cannot race a new release's aliases.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releases: ${{ steps.tags.outputs.releases }}
    steps:
      # Keep current workflow helpers available when building historical tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: tags
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REBUILD_COUNT: ${{ inputs.num_tags || 1 }}
        run: python3 tests/release_tags.py

  release:
    needs: select-tags
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.select-tags.outputs.releases) }}
        image: [dbcleanup, loganalyzer, syslogng]
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.release.ref }}
          persist-credentials: false
      - name: Resolve build paths and registry tags
        id: paths
        env:
          IMAGE_NAME: ${{ matrix.image }}
          ALIASES: ${{ join(matrix.release.aliases, ' ') }}
          OWNER: ${{ github.repository_owner }}
        run: |
          context="./resources/$IMAGE_NAME"
          dockerfile="resources/$IMAGE_NAME/Dockerfile"
          if [[ ! -f "$dockerfile" && -f "Dockerfile-$IMAGE_NAME" ]]; then
            context=.
            dockerfile="Dockerfile-$IMAGE_NAME"
          fi
          test -f "$dockerfile"
          {
            echo "context=$context"
            echo "dockerfile=$dockerfile"
            echo 'tags<<TAGS'
            for alias in $ALIASES; do
              echo "ghcr.io/${OWNER,,}/$IMAGE_NAME:$alias"
            done
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.paths.outputs.context }}
          file: ${{ steps.paths.outputs.dockerfile }}
          no-cache-filters: os-packages
          pull: true
          load: true
          platforms: linux/amd64
          tags: scan:${{ matrix.image }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
      - name: Scan image once
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan:${{ matrix.image }}
          scanners: vuln
          format: json
          output: trivy.json
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Generate report and enforce fixable HIGH/CRITICAL gate
        run: |
          trivy convert --format sarif --severity MEDIUM,HIGH,CRITICAL --output trivy.sarif trivy.json
          trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 trivy.json
      - name: Build arm64 image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.paths.outputs.context }}
          file: ${{ steps.paths.outputs.dockerfile }}
          no-cache-filters: os-packages
          pull: true
          load: true
          platforms: linux/arm64
          tags: scan:${{ matrix.image }}-arm64
          cache-from: type=gha,scope=release-${{ matrix.image }}
      - name: Scan arm64 image and enforce the same gate
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          trivy image --scanners vuln --ignore-unfixed --severity MEDIUM,HIGH,CRITICAL \
            --timeout 10m --format json --output trivy-arm64.json "scan:$IMAGE_NAME-arm64"
          trivy convert --format sarif --severity MEDIUM,HIGH,CRITICAL --output trivy-arm64.sarif trivy-arm64.json
          trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 trivy-arm64.json
      - name: Keep vulnerability reports
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.release.ref }}-${{ matrix.image }}
          path: |
            trivy*.json
            trivy*.sarif
          retention-days: 7
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch images
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.paths.outputs.context }}
          file: ${{ steps.paths.outputs.dockerfile }}
          # Both architectures were freshly built and scanned on this builder.
          # Reuse those exact layers instead of rebuilding OS packages again.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.paths.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.release.ref }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

name: CI (lint, build, scan, e2e)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: tests/requirements-lint.txt
      - uses: actions/cache@v5
        with:
          path: .lint-tools
          key: native-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lint-tools.json') }}
      - name: Run all repository linters
        run: ./tests/linter-check.sh
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Compose configurations and production/development parity
        run: python3 tests/check_compose.py
      - name: Detect changes requiring runtime checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          runtime=false
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            runtime=true
          else
            git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md|LICENSE|.vscode/*|.github/ISSUE_TEMPLATE/*|.github/funding.yml) ;;
                renovate.json|.github/dependabot.yml|lint-tools.json|ruff.toml|.hadolint.yaml|.yamllint.yaml) ;;
                .editorconfig|.gitignore|tests/linter-check.sh|tests/lint.py|tests/requirements-lint.txt) ;;
                tests/install_lint_tools.py|tests/test_install_lint_tools.py|tests/release_tags.py|tests/test_release_tags.py) ;;
                *) runtime=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

  stack:
    name: Stack (${{ matrix.arch }})
    needs: lint
    if: needs.lint.outputs.runtime == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      # Native ARM testing on main avoids QEMU and rebuilding amd64 a second time.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'push' &&
          '[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' ||
          '[{"arch":"amd64","runner":"ubuntu-latest"}]') }}
    env:
      SCAN_CATEGORY: ${{ matrix.arch }}
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Resolve build configuration from Compose
        run: docker compose --env-file .env.example -f docker-compose.dev.yml config > "$RUNNER_TEMP/build.yml"
      - name: Build application images once
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ runner.temp }}/build.yml
          load: true
          pull: true
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.no-cache-filter=os-packages
            syslogng.cache-from=type=gha,scope=syslogng-${{ matrix.arch }}
            syslogng.cache-to=type=gha,mode=max,scope=syslogng-${{ matrix.arch }}
            loganalyzer.cache-from=type=gha,scope=loganalyzer-${{ matrix.arch }}
            loganalyzer.cache-to=type=gha,mode=max,scope=loganalyzer-${{ matrix.arch }}
            dbcleanup.cache-from=type=gha,scope=dbcleanup-${{ matrix.arch }}
            dbcleanup.cache-to=type=gha,mode=max,scope=dbcleanup-${{ matrix.arch }}
      - name: Test the freshly built images
        run: ./tests/e2e-check.sh --skip-build
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.70.0
      - name: Verify vulnerability exception boundaries
        run: python3 -m unittest discover -s tests -p 'test_scan_policy.py'
      - name: Determine vulnerability cache date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache vulnerability database
        uses: actions/cache@v5
        with:
          path: .cache/trivy/db
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-
      - name: Scan tested application and database images
        id: scan
        run: |
          database=$(docker compose --env-file .env.example config --format json | jq -er '.services.database.image')
          ./tests/scan-images.sh "$RUNNER_TEMP/trivy" \
            syslogng=syslogng-mysql:latest loganalyzer=loganalyzer:dev \
            dbcleanup=dbcleanup:latest "database=$database"
      - name: Keep vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.arch }}
          path: ${{ runner.temp }}/trivy/
          retention-days: 7
          if-no-files-found: ignore
      # Fork and Dependabot PRs need no permission to write code-scanning results.
      - name: Upload SARIF on main
        if: always() && github.event_name == 'push' && steps.scan.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/trivy

  ci_result:
    name: CI required
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, stack]
    steps:
      - name: Require all applicable checks to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          STACK_RESULT: ${{ needs.stack.result }}
          RUNTIME: ${{ needs.lint.outputs.runtime }}
        run: |
          echo "lint=$LINT_RESULT stack=$STACK_RESULT runtime=$RUNTIME"
          [[ "$LINT_RESULT" == success ]]
          if [[ "$RUNTIME" == true ]]; then
            [[ "$STACK_RESULT" == success ]]
          else
            [[ "$RUNTIME" == false && "$STACK_RESULT" == skipped ]]
          fi

name: CI (lint, build, scan, e2e)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Run all repository linters
        run: ./tests/linter-check.sh
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  build_and_scan:
    name: Build and scan (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: loganalyzer
            dockerfile: resources/loganalyzer/Dockerfile
            context: ./resources/loganalyzer
          - name: syslogng
            dockerfile: resources/syslogng/Dockerfile
            context: ./resources/syslogng
          - name: dbcleanup
            dockerfile: resources/dbcleanup/Dockerfile
            context: ./resources/dbcleanup
          - name: database
            dockerfile: ''
            context: ''
    env:
      LOCAL_TAG: ${{ matrix.image.name }}:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Buildx
        if: matrix.image.dockerfile != ''
        uses: docker/setup-buildx-action@v4

      - name: Build and load scan image
        if: matrix.image.dockerfile != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          no-cache-filters: os-packages
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull configured database image
        if: matrix.image.name == 'database'
        run: |
          image=$(docker compose --env-file .env.example -f docker-compose.dev.yml config --format json |
            jq -er '.services.database.image')
          docker pull "$image"
          docker tag "$image" "$LOCAL_TAG"

      - name: Trivy report
        id: report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scanners: vuln
          image-ref: ${{ env.LOCAL_TAG }}
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy gate (fixable HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scanners: vuln
          image-ref: ${{ env.LOCAL_TAG }}
          format: table
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Keep vulnerability report
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.image.name }}
          path: trivy-${{ matrix.image.name }}.sarif
          retention-days: 7
          if-no-files-found: error

      # PR checks, including Dependabot/forks, do not require SARIF write access.
      - name: Upload SARIF on main
        if: always() && github.event_name == 'push' && steps.report.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}

  build_multiarch:
    name: Multi-arch build (${{ matrix.image.name }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build_and_scan
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: loganalyzer
            dockerfile: resources/loganalyzer/Dockerfile
            context: ./resources/loganalyzer
          - name: syslogng
            dockerfile: resources/syslogng/Dockerfile
            context: ./resources/syslogng
          - name: dbcleanup
            dockerfile: resources/dbcleanup/Dockerfile
            context: ./resources/dbcleanup
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          no-cache-filters: os-packages
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end stack test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and test this checkout
        run: ./tests/e2e-check.sh

  ci_result:
    name: CI required
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, build_and_scan, build_multiarch, e2e]
    steps:
      - name: Require all applicable checks to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SCAN_RESULT: ${{ needs.build_and_scan.result }}
          MULTIARCH_RESULT: ${{ needs.build_multiarch.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "lint=$LINT_RESULT scan=$SCAN_RESULT multiarch=$MULTIARCH_RESULT e2e=$E2E_RESULT"
          if [[ "$LINT_RESULT" != success || "$SCAN_RESULT" != success || "$E2E_RESULT" != success ]]; then
            exit 1
          fi
          if [[ "$EVENT_NAME" == push && "$MULTIARCH_RESULT" != success ]]; then
            exit 1
          fi

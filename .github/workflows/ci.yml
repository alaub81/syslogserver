name: CI (lint, build, scan, e2e)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: tests/requirements-lint.txt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: .lint-tools
          key: native-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lint-tools.json') }}
      - name: Plan checks and stack dependencies
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/change_plan.py
      - name: Run all repository linters
        run: ./tests/linter-check.sh
      - name: Run offline regressions and Compose parity checks
        if: steps.changes.outputs.tests == 'true'
        run: ./tests/test-check.sh
      - name: Scan changed commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./tools/secret-check.sh

  stack:
    name: Stack (${{ matrix.arch }})
    needs: lint
    if: needs.lint.outputs.runtime == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      # Both supported platforms are checked on native runners, including pull requests.
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      SCAN_CATEGORY: ${{ matrix.arch }}
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Resolve build configuration from Compose
        run: docker compose --env-file .env.example -f compose.dev.yml config > "$RUNNER_TEMP/build.yml"
      - name: Build application images once
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e  # v7
        with:
          source: .
          files: ${{ runner.temp }}/build.yml
          load: true
          pull: true
          set: |
            *.platform=linux/${{ matrix.arch }}
            *.no-cache-filter=os-packages
            syslogng.cache-from=type=gha,scope=syslogng-${{ matrix.arch }}
            syslogng.cache-to=type=gha,mode=max,scope=syslogng-${{ matrix.arch }}
            loganalyzer.cache-from=type=gha,scope=loganalyzer-${{ matrix.arch }}
            loganalyzer.cache-to=type=gha,mode=max,scope=loganalyzer-${{ matrix.arch }}
            dbcleanup.cache-from=type=gha,scope=dbcleanup-${{ matrix.arch }}
            dbcleanup.cache-to=type=gha,mode=max,scope=dbcleanup-${{ matrix.arch }}
      - name: Test the freshly built images
        run: ./tests/e2e-check.sh --skip-build
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514  # v0.2.6
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2
      - name: Verify vulnerability exception boundaries
        run: python3 -m unittest discover -s tests -p 'test_scan_policy.py'
      - name: Determine vulnerability cache date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache vulnerability database
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: .cache/trivy/db
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-
      - name: Scan tested application and database images
        id: scan
        run: |
          database=$(docker compose --env-file .env.example config --format json | jq -er '.services.database.image')
          ./tests/scan-images.sh "$RUNNER_TEMP/trivy" \
            syslogng=syslogng-mysql:latest loganalyzer=loganalyzer:dev \
            dbcleanup=dbcleanup:latest "database=$database"
      - name: Keep vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: trivy-${{ matrix.arch }}
          path: ${{ runner.temp }}/trivy/
          retention-days: 7
          if-no-files-found: ignore
      # Fork and Dependabot PRs need no permission to write code-scanning results.
      - name: Upload SARIF on main
        if: always() && github.event_name == 'push' && hashFiles(format('{0}/trivy/*.sarif', runner.temp)) != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy

  ci_result:
    name: CI required
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, stack]
    steps:
      - name: Require all applicable checks to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          STACK_RESULT: ${{ needs.stack.result }}
          RUNTIME: ${{ needs.lint.outputs.runtime }}
        run: |
          echo "lint=$LINT_RESULT stack=$STACK_RESULT runtime=$RUNTIME"
          [[ "$LINT_RESULT" == success ]]
          if [[ "$RUNTIME" == true ]]; then
            [[ "$STACK_RESULT" == success ]]
          else
            [[ "$RUNTIME" == false && "$STACK_RESULT" == skipped ]]
          fi

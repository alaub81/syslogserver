name: Security

on:
  schedule:
    - cron: '0 3 1 * *'  # Full secret history and published-image scan every month.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: false

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the complete committed history
        run: ./tools/secret-check.sh --full

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      SCAN_PLATFORM: linux/${{ matrix.arch }}
      SCAN_CATEGORY: published-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514  # v0.2.6
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          version: v0.76.2
      - name: Scan published application and database images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          database=$(docker compose --env-file .env.example config --format json | jq -er '.services.database.image')
          ./tests/scan-images.sh "$RUNNER_TEMP/trivy" \
            "syslogng=ghcr.io/${OWNER,,}/syslogng:latest" \
            "loganalyzer=ghcr.io/${OWNER,,}/loganalyzer:latest" \
            "dbcleanup=ghcr.io/${OWNER,,}/dbcleanup:latest" "database=$database"
      - name: Keep complete reports even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: published-trivy-${{ matrix.arch }}
          path: ${{ runner.temp }}/trivy/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload SARIF
        if: always() && github.event.repository.private == false && hashFiles(format('{0}/trivy/*.sarif', runner.temp)) != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy

# Standard syslog route. Works independently of the optional Shelly module.
# Keep this after vendor modules so their flags(final) can claim matching input.
log {
  source(s_udp);
  source(s_tcp);
  if (match("^<[0-9]+>1 " value("MESSAGE"))) {
    if { parser(p_ietf_syslog); };
  } else {
    if { parser(p_bsd_syslog); };
  };
  destination(d_mysql);
  destination(d_events_file);
  flags(flow-control);
};
log {
  source(s_src);
  destination(d_mysql);
  destination(d_events_file);
};

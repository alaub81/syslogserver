#@version: 3.38

options {
  flush_lines(1);
  time_reopen(1);
  log_fifo_size(10000);
  chain_hostnames(no);
  # Keep sender IPs without reverse-DNS lookups on the ingestion path.
  use_dns(no);
  use_fqdn(no);
  create_dirs(yes);
  keep_hostname(yes);
  stats(freq(0));
};

# Shared raw listeners. Vendor modules may inspect the original payload before
# 90-default.conf parses standard RFC3164/RFC5424 messages.
source s_udp {
  network(transport(udp) port(514) flags(no-parse)
          log-msg-size(65536) so-rcvbuf(4194304));
};
source s_tcp {
  syslog(transport(tcp) port(514) flags(no-parse) log-msg-size(65536)
         log-iw-size(10000));
};
parser p_bsd_syslog { syslog-parser(); };
parser p_ietf_syslog { syslog-parser(flags(syslog-protocol)); };

destination d_mysql {
  sql(type(mysql)
      host("database")
      port("3306")
      username("`DB_USER`")
      password("`DB_PASSWORD`")
      database("`DB_NAME`")
      session-statements("SET NAMES utf8mb4")
      # One durable commit per batch instead of per row. Low traffic still
      # becomes visible within about one second. Pending RAM queues are volatile.
      flags(explicit-commits)
      batch-lines(100)
      batch-timeout(1000)
      table("SystemEvents")
      columns("ReceivedAt", "DeviceReportedTime", "Facility", "Priority",
              "FromHost", "Message", "SysLogTag", "ProcessID", "Importance", "EventSource")
      values("${R_YEAR}-${R_MONTH}-${R_DAY} ${R_HOUR}:${R_MIN}:${R_SEC}",
             "${S_YEAR}-${S_MONTH}-${S_DAY} ${S_HOUR}:${S_MIN}:${S_SEC}",
             "${FACILITY_NUM}", "${LEVEL_NUM}",
             "${HOST}", "${MESSAGE}", "${PROGRAM}", "${PID:-0}", "0", "${.event.source}")
      indexes("ReceivedAt", "FromHost")
  );
};

# Normalized file history. JSON Lines preserves multiline messages and UTF-8.
# Compose selects a persistent host directory or the optional RAM volume.
destination d_events_file {
  file("/var/log/events.log"
       template("$(format-json --key R_ISODATE --key HOST --key PROGRAM --key PID --key MESSAGE --key FACILITY_NUM --key LEVEL_NUM)\n"));
};

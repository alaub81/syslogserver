# Persistent file logs by default; .env can select the SD-card-friendly RAM volume.
x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "false"

services:
  syslogng:
    logging: *service-logging
    image: ghcr.io/alaub81/syslogng:latest
    ports:
      - "${SYSLOG_UDP_PORT}:514/udp"
      - "${SYSLOG_TCP_PORT}:514"
    environment:
      DB_HOST: database
      DB_NAME: ${DB_NAME:-syslogdb}
      DB_USER: ${DB_USER:-syslog}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      LOGROTATE_CRON: ${LOGROTATE_CRON:-0 * * * *}
      LOGROTATE_SIZE: ${LOGROTATE_SIZE:-50M}
      LOGROTATE_MAX_AGE_DAYS: ${LOGROTATE_MAX_AGE_DAYS:-30}
      LOGROTATE_ROTATIONS: ${LOGROTATE_ROTATIONS:-7}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD", "/usr/sbin/syslog-ng-ctl", "healthcheck", "--timeout", "2"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 10s
    volumes:
      - ./data/syslog-ng/config:/etc/syslog-ng/conf.d/
      # A relative/absolute path persists files; ramlogs selects the tmpfs volume.
      - "${SYSLOG_LOG_STORAGE:-./data/syslog-ng/logs}:/var/log"
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/logrotate:size=1m
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  loganalyzer:
    logging: *service-logging
    image: ghcr.io/alaub81/loganalyzer:latest
    environment:
      TZ: ${TZ}
      DB_HOST: database
      DB_NAME: ${DB_NAME:-syslogdb}
      DB_USER: ${DB_USER:-syslog}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "--output", "/dev/null", "http://127.0.0.1/"]
      interval: 5m
      timeout: 3s
      retries: 2
      start_period: 30s
      start_interval: 10s
    ports:
      - "${LOGANALYZER_PORT}:80"
    volumes:
      - ./data/loganalyzer/config/config.php:/var/www/html/config.php
      - ./resources/loganalyzer/apache-pi.conf:/etc/apache2/conf-enabled/zz-pi.conf:ro
      - ./resources/loganalyzer/php-overrides.ini:/usr/local/etc/php/conf.d/zz-loganalyzer.ini:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    logging: *service-logging
    image: mariadb:13
    command:
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-256M}
      # 1 keeps committed transactions durable; 2 is an explicit tradeoff.
      - --innodb-flush-log-at-trx-commit=${DB_FLUSH_AT_COMMIT:-1}
      # Standalone collector: no replication or point-in-time recovery.
      - --skip-log-bin
      - --max-connections=30
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-syslogdb}
      MARIADB_USER: ${DB_USER:-syslog}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${TZ}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec mariadb --protocol=tcp --host=127.0.0.1 --connect-timeout=2
          --user="$${MARIADB_USER}" --password="$${MARIADB_PASSWORD}"
          --database="$${MARIADB_DATABASE}" --execute='SELECT 1' >/dev/null
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 10s
    volumes:
      - dbdata:/var/lib/mysql
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql

  dbcleanup:
    logging: *service-logging
    image: ghcr.io/alaub81/dbcleanup:latest
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_NAME: ${DB_NAME:-syslogdb}
      DB_USER: ${DB_USER:-syslog}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS}
      DBCLEANUP_CRON: ${DBCLEANUP_CRON}
      DBCLEANUP_BATCH_SIZE: ${DBCLEANUP_BATCH_SIZE:-1000}
      DBCLEANUP_BATCH_PAUSE: ${DBCLEANUP_BATCH_PAUSE:-0.1}
      TZ: ${TZ}
    volumes:
      # Use this checkout's batched cleanup with prebuilt images as well.
      - ./resources/dbcleanup/dbcleanup.sh:/app/dbcleanup.sh:ro
    restart: unless-stopped

volumes:
  dbdata:
  ramlogs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=${SYSLOG_LOG_RAM_SIZE:-128m},mode=0755"
